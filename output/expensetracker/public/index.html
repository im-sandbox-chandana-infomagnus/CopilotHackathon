<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly | Expense Tracker</title><style>
:root{font-family:system-ui,sans-serif;color:#243238;background:#f4f7f1}*{box-sizing:border-box}body{margin:0}main{width:min(1100px,94vw);margin:30px auto}.header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{margin:0;font-size:2.2rem}h2{font-size:1.05rem}button,input,select{font:inherit;padding:10px;border:1px solid #dfe7dd;border-radius:8px;background:white}button{cursor:pointer}.header p{color:#5d9b79}.stats,.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat,.panel{padding:20px;border:1px solid #dfe7dd;border-radius:14px;background:white}.stat.primary{background:#356c55;color:white}.label{font-size:.72rem;text-transform:uppercase;color:#71807f}.primary .label{color:#d8eadc}.value{font-size:1.8rem;font-weight:700;margin-top:8px}.columns{grid-template-columns:1fr 1fr;margin-top:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full,.submit,.error{grid-column:1/-1}.field label{font-size:.78rem;color:#71807f;font-weight:600}.field input,.field select{width:100%}.submit{background:#356c55;color:white;font-weight:700}.bars{display:grid;gap:12px}.bar{display:grid;grid-template-columns:100px 1fr 65px;gap:8px;align-items:center;font-size:.8rem}.track{height:9px;background:#edf0ec;border-radius:10px;overflow:hidden}.fill{height:100%;background:#dfad4d}.list{max-height:310px;overflow:auto}.expense{display:grid;grid-template-columns:1fr auto 28px;gap:10px;padding:12px 0;border-bottom:1px solid #edf0ec}.expense strong,.expense small{display:block}.expense small{color:#71807f;font-size:.75rem}.delete{padding:3px 8px;color:#cf755f}.toolbar{display:flex;gap:8px}.toolbar input{width:100%}.export{white-space:nowrap;background:#e8f0e6;color:#356c55}.error{color:#cf755f;font-size:.8rem}@media(max-width:700px){main{margin:18px auto}.header{display:block}.header h1{font-size:1.8rem}.stats,.columns{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full,.submit,.error{grid-column:auto}}
</style></head><body><main><header class="header"><div><p>LEDGERLY</p><h1>Your spending, at a glance.</h1></div><input id="month" type="month" aria-label="Month"></header><section class="stats"><div class="stat primary"><div class="label">Monthly total</div><div class="value" id="total">$0.00</div><small id="count">0 expenses</small></div><div class="stat"><div class="label">Average expense</div><div class="value" id="average">$0.00</div></div><div class="stat"><div class="label">Top category</div><div class="value" id="top">—</div></div></section><section class="columns"><div class="panel"><h2>Add an expense</h2><form class="form" id="form"><div class="field"><label>Amount *</label><input id="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Category *</label><select id="category" required></select></div><div class="field"><label>Date *</label><input id="date" type="date" required></div><div class="field full"><label>Description</label><input id="description" maxlength="120" placeholder="What was this for?"></div><p class="error" id="error" hidden></p><button class="submit" type="submit">Add expense</button></form></div><div class="panel"><h2>Spending by category</h2><div class="bars" id="bars"></div></div></section><section class="panel" style="margin-top:18px"><h2>Recent expenses</h2><div class="toolbar"><input id="search" placeholder="Search by category or description"><button class="export" id="export">Export CSV</button></div><div class="list" id="list"></div></section></main><script>
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);let month=new Date().toISOString().slice(0,7),items=[];$('#month').value=month;$('#date').value=new Date().toISOString().slice(0,10);async function load(){const [s,e]=await Promise.all([fetch('/api/summary?month='+month),fetch('/api/expenses?from='+month+'-01&to='+month+'-31&search='+encodeURIComponent($('#search').value))]);const summary=await s.json();items=await e.json();$('#total').textContent=money(summary.total);$('#count').textContent=summary.count+' expense'+(summary.count===1?'':'s');$('#average').textContent=money(summary.average);$('#top').textContent=summary.byCategory[0]?.category||'—';const max=summary.byCategory[0]?.total||1;$('#bars').innerHTML=summary.byCategory.length?summary.byCategory.map(x=>`<div class="bar"><span>${x.category}</span><div class="track"><div class="fill" style="width:${x.total/max*100}%"></div></div><span>${money(x.total)}</span></div>`).join(''):'<p>No spending yet.</p>';$('#list').innerHTML=items.length?items.map(x=>`<div class="expense"><span><strong>${escapeHtml(x.description)}</strong><small>${x.category} · ${x.date}</small></span><b>${money(x.amount)}</b><button class="delete" data-id="${x.id}">×</button></div>`).join(''):'<p>No matching expenses.</p>'}function escapeHtml(v){const s=document.createElement('span');s.textContent=v;return s.innerHTML}$('#month').onchange=e=>{month=e.target.value;load()};$('#search').oninput=load;$('#form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:$('#amount').value,category:$('#category').value,date:$('#date').value,description:$('#description').value})});if(!r.ok){$('#error').textContent=(await r.json()).error;$('#error').hidden=false;return}e.target.reset();$('#date').value=new Date().toISOString().slice(0,10);$('#error').hidden=true;load()};$('#list').onclick=async e=>{if(!e.target.dataset.id)return;await fetch('/api/expenses/'+e.target.dataset.id,{method:'DELETE'});load()};$('#export').onclick=()=>{const rows=['id,amount,category,date,description',...items.map(x=>[x.id,x.amount,x.category,x.date,'"'+x.description.replaceAll('"','""')+'"'].join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='expenses-'+month+'.csv';a.click()};fetch('/api/categories').then(r=>r.json()).then(c=>{$('#category').innerHTML=c.map(x=>`<option>${x}</option>`).join('');load()});
</script></body></html>

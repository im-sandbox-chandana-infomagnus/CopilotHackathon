<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quality automotive parts, ready for the road.">
  <title>Axle &amp; Co. | Automotive parts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #192a32; --muted: #6d7d80; --line: #dce6e3; --paper: #f4f7f4; --white: #fff; --teal: #146c68; --teal-dark: #0c4c4b; --coral: #e7775d; --yellow: #f5c95c; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "DM Sans", sans-serif; }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .shell { min-height: 100vh; background: radial-gradient(circle at 94% 4%, #dceee4 0 12%, transparent 31%), radial-gradient(circle at 4% 80%, #f8e2d4 0 9%, transparent 30%), var(--paper); }
    .topbar { display: flex; align-items: center; justify-content: space-between; width: min(1240px, calc(100% - 48px)); margin: auto; padding: 22px 0; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--teal-dark); font-family: "Space Grotesk", sans-serif; font-size: 1.15rem; font-weight: 700; }
    .mark { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 11px 11px 11px 3px; background: var(--coral); color: #fff; }
    .cart-button { display: flex; align-items: center; gap: 9px; padding: 10px 15px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font-weight: 700; }
    .cart-count { display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 50%; background: var(--teal); color: #fff; font-size: .75rem; }
    .hero { width: min(1240px, calc(100% - 48px)); margin: 22px auto 30px; padding: 54px clamp(24px, 6vw, 78px); overflow: hidden; border-radius: 20px; background: var(--teal-dark); color: #f8fff9; position: relative; }
    .hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: 8%; top: -110px; border: 48px solid #e7775d55; border-radius: 50%; }
    .eyebrow { margin: 0 0 14px; color: #f5c95c; font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; }
    h1 { max-width: 640px; margin: 0 0 15px; font-size: clamp(2.2rem, 5vw, 4.6rem); line-height: .98; letter-spacing: -.06em; }
    .hero p { max-width: 490px; margin: 0; color: #c8ded9; line-height: 1.6; }
    .content { width: min(1240px, calc(100% - 48px)); margin: auto; }
    .toolbar { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 22px; }
    .toolbar h2 { margin: 0 0 5px; font-size: 1.45rem; letter-spacing: -.04em; }
    .result-count { margin: 0; color: var(--muted); font-size: .85rem; }
    .search { display: flex; align-items: center; gap: 9px; width: min(370px, 100%); padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .search input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 16px; padding-bottom: 42px; }
    .product { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: #fff; animation: lift .35s ease both; }
    .product-visual { display: grid; place-items: center; height: 174px; padding: 22px; background: #e8f1ed; color: var(--teal); }
    .product-visual img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
    .part-icon { font-size: 4rem; }
    .product-body { display: flex; flex: 1; flex-direction: column; padding: 17px; }
    .manufacturer { margin: 0 0 7px; color: var(--coral); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .product h3 { margin: 0 0 7px; font-size: 1.08rem; }
    .description { min-height: 40px; margin: 0 0 17px; color: var(--muted); font-size: .85rem; line-height: 1.45; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
    .price { font-size: 1.18rem; font-weight: 700; }
    .add-button, .primary-button { padding: 10px 13px; border-radius: 9px; background: var(--teal); color: #fff; font-weight: 700; }
    .add-button:hover, .primary-button:hover { background: var(--teal-dark); }
    .secondary-button { padding: 10px 13px; border-radius: 9px; background: #edf4f1; color: var(--teal-dark); font-weight: 700; }
    .empty { grid-column: 1 / -1; padding: 55px; border: 1px dashed #b9ceca; border-radius: 14px; color: var(--muted); text-align: center; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 2; background: #102c2b66; }
    .drawer { position: fixed; inset: 0 0 0 auto; z-index: 3; display: flex; width: min(470px, 100%); flex-direction: column; padding: 25px; background: #fff; box-shadow: -18px 0 50px #10333025; animation: slide .25s ease; }
    .drawer[hidden], .drawer-backdrop[hidden], .detail[hidden] { display: none; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .drawer h2 { margin: 0; font-size: 1.4rem; }
    .close { width: 35px; height: 35px; border-radius: 9px; background: #edf4f1; color: var(--teal-dark); font-size: 1.2rem; }
    .cart-items { flex: 1; overflow: auto; padding: 8px 0; }
    .cart-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .cart-item h3 { margin: 0 0 5px; font-size: .98rem; }
    .cart-item p { margin: 0; color: var(--muted); font-size: .8rem; }
    .cart-controls { display: flex; align-items: center; gap: 9px; margin-top: 12px; }
    .quantity { display: grid; place-items: center; min-width: 25px; }
    .quantity-button { width: 27px; height: 27px; border-radius: 7px; background: #edf4f1; color: var(--teal-dark); }
    .remove { margin-top: 9px; padding: 0; background: none; color: var(--coral); font-size: .76rem; }
    .cart-total { border-top: 1px solid var(--line); padding-top: 18px; }
    .total-line { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.15rem; font-weight: 700; }
    .full { width: 100%; }
    .empty-cart { padding: 50px 10px; color: var(--muted); text-align: center; }
    .detail { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 20px; background: #102c2b66; }
    .detail-card { width: min(720px, 100%); max-height: 90vh; overflow: auto; border-radius: 17px; background: #fff; }
    .detail-top { display: grid; grid-template-columns: 40% 1fr; }
    .detail-visual { display: grid; place-items: center; min-height: 280px; padding: 25px; background: #e8f1ed; color: var(--teal); }
    .detail-visual img { width: 100%; height: 220px; object-fit: contain; mix-blend-mode: multiply; }
    .detail-content { padding: 30px; }
    .detail-content h2 { margin: 0 0 10px; font-size: 2rem; }
    .detail-content p { color: var(--muted); line-height: 1.55; }
    .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 22px 0; }
    .spec { padding: 10px; border-radius: 8px; background: #f1f6f3; font-size: .8rem; }
    .spec strong { display: block; margin-bottom: 3px; color: var(--teal); font-size: .68rem; text-transform: uppercase; }
    @keyframes lift { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slide { from { transform: translateX(30px); } to { transform: translateX(0); } }
    @media (max-width: 650px) { .topbar, .hero, .content { width: min(100% - 28px, 1240px); } .topbar { padding: 15px 0; } .hero { margin-top: 12px; padding: 39px 24px; } .toolbar { align-items: stretch; flex-direction: column; } .search { width: 100%; } .detail-top { grid-template-columns: 1fr; } .detail-visual { min-height: 190px; } .detail-visual img { height: 160px; } .detail-content { padding: 23px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="mark">✦</span> Axle &amp; Co.</div><button class="cart-button" id="cartButton" aria-label="Open shopping cart">Cart <span class="cart-count" id="cartCount">0</span></button></header>
    <section class="hero"><p class="eyebrow">Parts for the long haul</p><h1>Keep every mile moving.</h1><p>Reliable automotive parts from manufacturers you can trust, ready for the next repair.</p></section>
    <main class="content"><div class="toolbar"><div><h2>Browse parts</h2><p class="result-count" id="resultCount">Loading parts...</p></div><label class="search" for="searchInput">⌕ <input id="searchInput" type="search" placeholder="Search parts, makers, models..." autocomplete="off"></label></div><section class="catalog" id="catalog" aria-live="polite"></section></main>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="cartDrawer" hidden aria-label="Shopping cart"><div class="drawer-head"><h2>Your cart</h2><button class="close" id="closeCart" aria-label="Close cart">×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-total"><div class="total-line"><span>Total</span><span id="cartTotal">$0.00</span></div><button class="primary-button full" id="checkoutButton">Checkout</button></div></aside>
  <div class="detail" id="detailModal" hidden><article class="detail-card" id="detailCard"></article></div>
  <script>
    const catalog = document.querySelector('#catalog');
    const resultCount = document.querySelector('#resultCount');
    const searchInput = document.querySelector('#searchInput');
    const cart = JSON.parse(localStorage.getItem('axle-cart') || '{}');
    let currentItems = [];
    let searchTimer;

    const money = (value) => `$${value.toFixed(2)}`;
    const escapeText = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
    const iconFor = (part) => ({ 'Brake Pad Set': '◈', 'Oil Filter': '◉', 'Spark Plug': 'ϟ', 'Air Filter': '▤', Alternator: '⟳' }[part.name] || '⚙');
    function imageMarkup(part, className) { return part.image_url && !part.image_url.includes('example.com') ? `<img class="${className}" src="${escapeText(part.image_url)}" alt="${escapeText(part.name)}">` : `<span class="part-icon" aria-hidden="true">${iconFor(part)}</span>`; }

    async function loadParts() {
      const query = encodeURIComponent(searchInput.value.trim());
      const response = await fetch(`/api/parts?limit=50&search=${query}`);
      const data = await response.json();
      currentItems = data.items;
      resultCount.textContent = `${data.total} ${data.total === 1 ? 'part' : 'parts'} available`;
      catalog.replaceChildren();
      if (!data.items.length) { catalog.innerHTML = '<div class="empty">No parts match that search. Try a manufacturer or model name.</div>'; return; }
      data.items.forEach((part, index) => {
        const card = document.createElement('article'); card.className = 'product'; card.style.animationDelay = `${Math.min(index * 45, 300)}ms`;
        card.innerHTML = `<div class="product-visual">${imageMarkup(part, 'product-image')}</div><div class="product-body"><p class="manufacturer">${escapeText(part.manufacturer)}</p><h3>${escapeText(part.name)}</h3><p class="description">${escapeText(part.description)}</p><div class="product-footer"><span class="price">${money(part.price)}</span><button class="add-button" data-add="${part.id}">Add to cart</button></div><button class="secondary-button" data-detail="${part.id}" style="margin-top:9px">View details</button></div>`;
        catalog.append(card);
      });
    }

    function saveCart() { localStorage.setItem('axle-cart', JSON.stringify(cart)); renderCart(); }
    function addToCart(id) { const part = currentItems.find((item) => item.id === id) || Object.values(cart).find((item) => item.id === id); if (!part) return; const existing = cart[id]; if (existing && existing.quantity >= part.stock) return; cart[id] = { ...part, quantity: (existing?.quantity || 0) + 1 }; saveCart(); }
    function changeQuantity(id, amount) { if (!cart[id]) return; cart[id].quantity += amount; if (cart[id].quantity <= 0) delete cart[id]; if (cart[id] && cart[id].quantity > cart[id].stock) cart[id].quantity = cart[id].stock; saveCart(); }
    function renderCart() {
      const items = Object.values(cart); document.querySelector('#cartCount').textContent = items.reduce((sum, item) => sum + item.quantity, 0); document.querySelector('#cartTotal').textContent = money(items.reduce((sum, item) => sum + item.price * item.quantity, 0));
      const list = document.querySelector('#cartItems'); list.replaceChildren();
      if (!items.length) { list.innerHTML = '<div class="empty-cart">Your cart is waiting for its first part.</div>'; return; }
      items.forEach((item) => { const row = document.createElement('div'); row.className = 'cart-item'; row.innerHTML = `<div><h3>${escapeText(item.name)}</h3><p>${money(item.price)} each · ${item.stock} in stock</p><div class="cart-controls"><button class="quantity-button" data-minus="${item.id}" aria-label="Decrease quantity">−</button><span class="quantity">${item.quantity}</span><button class="quantity-button" data-plus="${item.id}" aria-label="Increase quantity">+</button></div><button class="remove" data-remove="${item.id}">Remove</button></div><strong>${money(item.price * item.quantity)}</strong>`; list.append(row); });
    }
    function toggleCart(open) { document.querySelector('#cartDrawer').hidden = !open; document.querySelector('#drawerBackdrop').hidden = !open; }
    async function showDetails(id) { const response = await fetch(`/api/parts/${id}`); const part = await response.json(); const specs = Object.entries(part.specifications || {}).map(([key, value]) => `<div class="spec"><strong>${escapeText(key)}</strong>${escapeText(value)}</div>`).join(''); document.querySelector('#detailCard').innerHTML = `<div class="detail-top"><div class="detail-visual">${imageMarkup(part, 'detail-image')}</div><div class="detail-content"><p class="manufacturer">${escapeText(part.manufacturer)} · ${escapeText(part.part_number)}</p><h2>${escapeText(part.name)}</h2><p>${escapeText(part.description)}</p><p><strong>${money(part.price)}</strong> · ${part.stock} available</p><div class="specs">${specs}</div><button class="primary-button" data-detail-add="${part.id}">Add to cart</button></div></div>`; document.querySelector('#detailModal').hidden = false; }

    catalog.addEventListener('click', (event) => { const add = event.target.closest('[data-add]'); const detail = event.target.closest('[data-detail]'); if (add) addToCart(Number(add.dataset.add)); if (detail) showDetails(Number(detail.dataset.detail)); });
    document.querySelector('#cartItems').addEventListener('click', (event) => { const button = event.target.closest('button'); if (!button) return; const id = Number(button.dataset.minus || button.dataset.plus || button.dataset.remove); if (button.dataset.minus) changeQuantity(id, -1); if (button.dataset.plus) changeQuantity(id, 1); if (button.dataset.remove) { delete cart[id]; saveCart(); } });
    searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadParts, 180); });
    document.querySelector('#cartButton').addEventListener('click', () => toggleCart(true)); document.querySelector('#closeCart').addEventListener('click', () => toggleCart(false)); document.querySelector('#drawerBackdrop').addEventListener('click', () => toggleCart(false));
    document.querySelector('#detailModal').addEventListener('click', (event) => { if (event.target.id === 'detailModal') event.currentTarget.hidden = true; const add = event.target.closest('[data-detail-add]'); if (add) addToCart(Number(add.dataset.detailAdd)); });
    document.querySelector('#checkoutButton').addEventListener('click', () => { if (Object.keys(cart).length) alert('Thanks! Checkout is ready for your order.'); });
    renderCart(); loadParts();
  </script>
</body>
</html>

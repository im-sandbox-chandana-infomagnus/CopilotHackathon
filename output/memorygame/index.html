<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flip Theory | Memory Game</title>
<style>
:root{font-family:system-ui,sans-serif;color:#26343b;background:#f4f6ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e4f0df,#f5e6c6)}main{width:min(850px,94vw);padding:28px;border:1px solid #dfe7dd;border-radius:20px;background:#fffffff2;box-shadow:0 20px 60px #315c4a22}header{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:25px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}p{margin:.4rem 0;color:#778580}.controls{display:flex;gap:8px}button,select{font:inherit;padding:10px;border:1px solid #dfe7dd;border-radius:8px;background:white;cursor:pointer}.new{background:#315c4a;color:white}.layout{display:grid;grid-template-columns:1fr 190px;gap:22px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;aspect-ratio:1}.card{padding:0;border:0;background:transparent;perspective:700px}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;backface-visibility:hidden}.back{background:#5d9b79;color:#d9ead8;font-size:1.5rem}.back:after{content:'✦'}.front{transform:rotateY(180deg);background:white;border:1px solid #dfe7dd;font-size:clamp(1.6rem,5vw,3rem)}.matched .front{background:#f0f8ed;border-color:#8fc39b}.stats{display:grid;gap:10px}.stat{padding:15px;border:1px solid #dfe7dd;border-radius:12px}.label{font-size:.7rem;color:#778580;text-transform:uppercase}.value{font-size:1.5rem;font-weight:700;margin-top:5px}.turn{text-align:center;color:#778580;margin-top:15px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#263b3188}.modal[hidden]{display:none}.dialog{padding:28px;border-radius:15px;background:white;text-align:center}.dialog h2{margin-top:0}@media(max-width:650px){main{padding:18px}.layout{display:block}.stats{grid-template-columns:repeat(3,1fr);margin-top:18px}.stat{padding:9px}.value{font-size:1.1rem}header{display:block}.controls{margin-top:15px}}
</style></head>
<body><main><header><div><p>FLIP THEORY</p><h1>Train your memory.</h1><p>Find every pair and keep your focus.</p></div><div class="controls"><select id="mode" aria-label="Game mode"><option value="1">Solo play</option><option value="2">Two players</option></select><button class="new" id="new">New game</button></div></header><section class="layout"><div><div class="board" id="board"></div><div class="turn" id="turn">Your turn. Choose a card.</div></div><div class="stats"><div class="stat"><div class="label">Pairs</div><div class="value" id="pairs">0 / 8</div></div><div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div><div class="stat"><div class="label">Time</div><div class="value" id="time">00:00</div></div></div></section></main><div class="modal" id="modal" hidden><div class="dialog"><h2 id="win">Board cleared!</h2><p id="result"></p><button class="new" id="again">Play again</button></div></div>
<script>
const symbols=['☀','☾','✿','◆','♞','♫','☕','✦'];const board=document.querySelector('#board');let open=[],matched=0,moves=0,seconds=0,locked=false,player=0,scores=[0,0],timer;const mode=document.querySelector('#mode');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function clock(){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}function stats(){document.querySelector('#pairs').textContent=`${matched} / 8`;document.querySelector('#moves').textContent=moves;document.querySelector('#time').textContent=clock()}function start(){if(!timer)timer=setInterval(()=>{seconds++;stats()},1000)}function reset(){clearInterval(timer);timer=null;open=[];matched=moves=seconds=player=0;scores=[0,0];locked=false;board.replaceChildren();shuffle([...symbols,...symbols]).forEach(symbol=>{const c=document.createElement('button');c.className='card';c.dataset.symbol=symbol;c.setAttribute('aria-label','Hidden card');c.innerHTML='<span class="inner"><span class="face back"></span><span class="face front">'+symbol+'</span></span>';c.onclick=()=>flip(c);board.append(c)});document.querySelector('#turn').textContent=mode.value==='1'?'Your turn. Choose a card.':"Player 1's turn. Choose a card.";stats()}function flip(c){if(locked||c.classList.contains('open')||c.classList.contains('matched'))return;start();c.classList.add('open');open.push(c);if(open.length<2)return;locked=true;moves++;const[a,b]=open;if(a.dataset.symbol===b.dataset.symbol){setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');matched++;scores[player]++;open=[];locked=false;stats();if(matched===8)finish()},350)}else setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');open=[];locked=false;if(mode.value==='2')player=1-player;document.querySelector('#turn').textContent=mode.value==='1'?'Your turn. Choose a card.':`Player ${player+1}'s turn. Choose a card.`;stats()},800);stats()}function finish(){clearInterval(timer);document.querySelector('#win').textContent=mode.value==='1'?'Board cleared!':scores[0]===scores[1]?"It's a draw!":`Player ${scores[0]>scores[1]?1:2} wins!`;document.querySelector('#result').textContent=`${moves} moves in ${clock()}.`;document.querySelector('#modal').hidden=false}document.querySelector('#new').onclick=reset;document.querySelector('#again').onclick=()=>{document.querySelector('#modal').hidden=true;reset()};mode.onchange=reset;reset();
</script></body></html>
